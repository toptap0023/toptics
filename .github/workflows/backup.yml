name: DB backup + keep-alive

# Two independent jobs on purpose. The app is used only a few times a month, so
# the keep-alive is what actually matters: a Supabase free project auto-pauses
# after 7 days of inactivity and a paused project breaks login. The backup runs
# separately so that when the dump breaks (it already has, twice), the
# keep-alive keeps running instead of dying with it.
#
# Vercel Cron (vercel.json) hits the same keep-alive endpoint daily, so this is
# the second layer, not the only one. That matters because GitHub disables
# scheduled workflows in a repo with 60 days of no activity.
#
# One-time setup: repo secret SUPABASE_DB_URL. Use the *Session pooler* string
# (Supabase > Connect > Session pooler), not the direct one: db.<ref>.supabase.co
# resolves to IPv6 only and GitHub runners are IPv4 only.
on:
  schedule:
    - cron: "0 3 */3 * *" # 03:00 UTC every 3rd day (< 7-day pause window)
  workflow_dispatch: {}    # lets you run it by hand from the Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      # Hits the deployed app, which runs one PostgREST read. No secret and no
      # database driver involved, so there is very little here that can rot.
      - name: Ping the app's keep-alive endpoint
        run: |
          curl -fsS --retry 3 --retry-delay 15 --max-time 30 \
            https://toptics.vercel.app/api/keep-alive

  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to commit the dump back
    steps:
      - uses: actions/checkout@v4

      # Supabase upgrades Postgres on its own schedule and pg_dump refuses to
      # dump a server newer than itself, so always install the newest client
      # from the official PGDG apt repo rather than pinning a major version.
      - name: Install the newest pg_dump
        run: |
          sudo sh -c 'echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # pg_dump stamps a random \restrict token at the top, which would make every
      # dump differ even when the data is identical. Strip it so the commit step below
      # only fires on real data changes. The token is a restore-time guard, not data.
      - name: Dump database
        shell: bash # -eo pipefail, so a pg_dump failure isn't masked by the pipe
        run: |
          PG_DUMP="$(ls -d /usr/lib/postgresql/*/bin/pg_dump | sort -V | tail -1)"
          echo "using $PG_DUMP ($("$PG_DUMP" --version))"
          "$PG_DUMP" --no-owner --no-privileges "${{ secrets.SUPABASE_DB_URL }}" \
            | grep -vE '^\\(un)?restrict ' > backups/toptics.sql

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/toptics.sql
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: db backup [skip ci]"
          git push
