name: DB backup + keep-alive

# Dumps the whole Supabase DB to backups/toptics.sql every 3 days and commits it.
# Side effect: connecting every 3 days keeps the free-tier project from auto-pausing,
# which is what was logging the user out (a paused project fails token refresh, so
# middleware sees no session and redirects to /login).
# One-time setup: add repo secret SUPABASE_DB_URL (Supabase > Settings > Database > Connection string, "URI").
on:
  schedule:
    - cron: "0 3 */3 * *" # 03:00 UTC every 3rd day (< 7-day pause window)
  workflow_dispatch: {}    # lets you run it by hand from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to commit the dump back
    steps:
      - uses: actions/checkout@v4

      # Supabase runs Postgres 17; the runner ships pg_dump 16, which refuses to dump a
      # newer server. Install the matching client from the official PGDG apt repo.
      - name: Install pg_dump 17
        run: |
          sudo sh -c 'echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      # pg_dump 17 stamps a random \restrict token at the top, which would make every
      # dump differ even when the data is identical. Strip it so the commit step below
      # only fires on real data changes. The token is a restore-time guard, not data.
      - name: Dump database
        shell: bash # -eo pipefail, so a pg_dump failure isn't masked by the pipe
        run: |
          /usr/lib/postgresql/17/bin/pg_dump --no-owner --no-privileges "${{ secrets.SUPABASE_DB_URL }}" \
            | grep -vE '^\\(un)?restrict ' > backups/toptics.sql

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/toptics.sql
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: db backup [skip ci]"
          git push
